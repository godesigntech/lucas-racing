# Netlify detects Next.js and deploys it with its Next.js runtime (server functions,
# image optimisation, caching). These settings override any older ones in the
# Netlify UI, which were set up for the previous Vite demo.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Public Supabase values: they ship to every visitor's browser anyway, and Next.js
  # bakes NEXT_PUBLIC_ values into the build, so the site works without extra setup.
  # Secrets (RESEND_API_KEY, EMAIL_FROM, WORKSHOP_EMAIL, GEMINI_API_KEY,
  # OPENAI_API_KEY, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN) belong in the Netlify UI.
  NEXT_PUBLIC_SUPABASE_URL = "https://hcknrshnqskckownpdkm.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_JjxRzkSOK68OaHtjiKsdZw_PrOvVRT3"
  NEXT_PUBLIC_SITE_URL = "https://lucas-racing.netlify.app"
  # Netlify's secret scan fails the deploy when it finds a dashboard variable's value
  # in the build. These three are public by design (Next.js builds them into the
  # browser code), so the scan skips them; every real secret is still checked.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SITE_URL"
